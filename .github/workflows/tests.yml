name: Tests hors ligne

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.1'
      - run: uv sync --locked
      - run: uv run --locked pytest --cov=ossgeo --cov-fail-under=90
      - run: uv run --locked mypy
      - run: uv run --locked ruff check ossgeo tests
      - run: uv run --locked black --check ossgeo tests
