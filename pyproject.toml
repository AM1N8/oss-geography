[project]
name = "open-sauce"
version = "0.1.0"
description = "Acquisition et préparation reproductibles pour Geography of GitHub"
readme = "README.md"
authors = [
    { email = "mohamedaminedarraj@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ossgeo = "ossgeo.cli:main"
open-sauce = "ossgeo.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "mypy>=1.15,<2", "black>=25,<27", "ruff>=0.11,<1"]

[tool.uv.build-backend]
module-name = "ossgeo"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["ossgeo"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
